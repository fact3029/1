name: Build Crusher EVO Sideloadly IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned IPA
        run: pnpm --filter @workspace/crusher-evo-boost run ipa:sideload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Crusher-EVO-Boost-Sideloadly
          path: artifacts/crusher-evo-boost/build/sideload/Crusher-EVO-Boost-Sideloadly.ipa
          if-no-files-found: error
          retention-days: 14
