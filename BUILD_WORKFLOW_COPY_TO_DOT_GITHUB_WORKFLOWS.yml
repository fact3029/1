name: Build Crusher EVO Sideloadly IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Select Xcode 26.2 with Swift 6.2
        shell: bash
        run: |
          set -Eeuo pipefail
          XCODE_APP="/Applications/Xcode_26.2.app"
          if [[ ! -d "${XCODE_APP}" ]]; then
            echo "::error::Xcode 26.2 is not installed on this runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          SWIFT_VERSION="$(swift --version | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -n 1)"
          if [[ "${SWIFT_VERSION}" != "6.2" ]]; then
            echo "::error::Xcode 26.2 must provide Swift 6.2, but ${SWIFT_VERSION:-unknown} is selected."
            exit 1
          fi

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned IPA
        run: pnpm --filter @workspace/crusher-evo-boost run ipa:sideload

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: Crusher-EVO-Boost-Sideloadly
          path: artifacts/crusher-evo-boost/build/sideload/Crusher-EVO-Boost-Sideloadly.ipa
          if-no-files-found: error
          retention-days: 14
